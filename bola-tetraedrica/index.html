<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bola tetraédrica — LVM</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f5f6f7;--panel:#fff;--text:#202124;--muted:#666b73;
      --border:#d7d9dd;--accent:#315fd4
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#111315;--panel:#1d2023;--text:#f3f4f5;--muted:#b3b8bf;--border:#3a3e44;--accent:#88a8ff}
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
    .app{height:100vh;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
    .title{font-weight:750}
    .back{color:var(--text);text-decoration:none;font-size:.92rem}
    .viewer{position:relative;flex:1;min-height:0}
    .canvas{position:absolute;inset:0}
    .canvas canvas{display:block;width:100%;height:100%;touch-action:none}
    .controls{
      position:absolute;left:14px;right:14px;bottom:14px;
      display:grid;grid-template-columns:minmax(180px,1fr) auto;
      gap:12px;align-items:end;padding:12px;border:1px solid var(--border);
      border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);
      backdrop-filter:blur(7px)
    }
    .range-wrap{min-width:0}
    .labels{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem}
    .stage{font-weight:700;margin-bottom:5px}
    .range{width:100%}
    .buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    button{font:inherit;min-height:42px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--panel);color:var(--text);cursor:pointer}
    button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--accent);border-color:var(--accent)}
    .primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .hint{
      position:absolute;left:14px;top:14px;max-width:min(560px,calc(100% - 28px));
      padding:9px 11px;border-radius:10px;
      background:color-mix(in srgb,var(--panel) 90%,transparent);
      border:1px solid var(--border);color:var(--muted);font-size:.84rem;pointer-events:none
    }
    @media(max-width:760px){
      body{overflow:auto}
      .app{min-height:100vh;height:auto}
      .viewer{min-height:650px}
      .controls{grid-template-columns:1fr}
      .buttons{justify-content:flex-start}
      .top{align-items:flex-start;flex-direction:column}
      .hint{font-size:.78rem}
    }
  </style>

  <script type="importmap">
  {
    "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <script src="bola-data.js?v=5"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="title">Bola tetraédrica — exploração 3D</div>
      <div style="font-size:.86rem;color:var(--muted)">Arranjo → triângulo maior → planificação → tetraedro → esfera</div>
    </div>
    <a class="back" href="../">← Interativos do LVM</a>
  </header>

  <main class="viewer">
    <div id="canvas-host" class="canvas"></div>

    <div class="hint">
      Arraste para girar · roda/pinça para zoom · botão direito para deslocar
    </div>

    <section class="controls" aria-label="Controles da visualização">
      <div class="range-wrap">
        <div id="stage" class="stage">Arranjo dos logos</div>
        <input id="morph" class="range" type="range" min="0" max="100" step="1" value="0"
               aria-label="Transformação entre planificação, tetraedro e esfera">
        <div class="labels">
          <span>Arranjo</span><span id="percent">0%</span><span>Esfera</span>
        </div>
      </div>

      <div class="buttons">
        <button type="button" data-stop="0">Arranjo</button>
        <button type="button" data-stop="20">Triângulo maior</button>
        <button type="button" data-stop="32">Planificação</button>
        <button type="button" data-stop="62">Tetraedro</button>
        <button type="button" data-stop="100">Esfera</button>
        <button id="seams" type="button" aria-pressed="true">Costuras curvas: sim</button>
        <button id="folds" type="button" aria-pressed="true">Dobras tetraédricas: sim</button>
        <button id="vertices" type="button" aria-pressed="false">Vértices: não</button>
        <button id="reset" type="button">Restaurar vista</button>
        <button id="play" type="button" class="primary">▶ Animar</button>
      </div>
    </section>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';

const DATA = window.TETRA_BALL_DATA;
if (!DATA) throw new Error('bola-data.js não foi carregado.');

const host = document.getElementById('canvas-host');
const morph = document.getElementById('morph');
const percent = document.getElementById('percent');
const stage = document.getElementById('stage');
const seamsButton = document.getElementById('seams');
const verticesButton = document.getElementById('vertices');
const foldsButton = document.getElementById('folds');
const resetButton = document.getElementById('reset');
const playButton = document.getElementById('play');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36,1,0.01,100);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000,0);
host.appendChild(renderer.domElement);

/* ---------------------------------------------------------------
   CONTROLE DE CÂMERA
   TrackballControls se aproxima mais da sensação do Plotly 3D:
   arrastar com o botão esquerdo gira livremente a cena, sem o eixo
   vertical rígido que deixava a esfera artificial no OrbitControls.
---------------------------------------------------------------- */
const controls = new TrackballControls(camera,renderer.domElement);
controls.rotateSpeed = 1.00;
controls.zoomSpeed = 1.08;
controls.panSpeed = 0.34;
controls.staticMoving = false;
controls.dynamicDampingFactor = 0.13;
controls.minDistance = 1.25;
controls.maxDistance = 8.5;

renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

/* Luz próxima à usada no código Plotly: majoritariamente ambiente. */
scene.add(new THREE.AmbientLight(0xffffff,0.90));
const key = new THREE.DirectionalLight(0xffffff,0.30);
key.position.set(2.3,-2.1,3.0);
scene.add(key);

const root = new THREE.Group();
scene.add(root);

const faceMeshes = [];
const seamLines = [];
const vertexMarkers = [];
const scissorMeshes = [];
const scissorCurveLines = [];
const foldGuideLines = [];
let showSeams = true;
let showFolds = true;
let showVertices = false;
let playing = false;
let playStart = 0;
let playFrom = 0;

/* ---------------------------------------------------------------
   TEXTURA
   Os dados vêm da geometria validada em Python. A malha controla a
   deformação; o padrão é convertido em textura UV de alta resolução,
   evitando que as bordas do padrão fiquem presas aos pequenos triângulos.
---------------------------------------------------------------- */
const PALETTE = new Map([
  ['43,182,115',[0,176,104]],
  ['46,117,212',[0,105,215]],
  ['229,57,53',[224,38,48]],
  ['248,248,244',[250,250,248]],
  ['242,231,196',[238,224,184]]
]);
const DISPLAY_COLORS = [...PALETTE.values()];
const TEXTURE_SIZE = 1536;
const TEXTURE_PAD = 18;

function mappedColor(rgb){
  return PALETTE.get(`${rgb[0]},${rgb[1]},${rgb[2]}`) || rgb;
}

function dominantColor(colors,tri){
  const count=new Map();
  for(const idx of tri){
    const key=colors[idx].join(',');
    count.set(key,(count.get(key)||0)+1);
  }
  let bestKey=null,bestCount=-1;
  for(const [key,n] of count){
    if(n>bestCount){bestKey=key;bestCount=n;}
  }
  if(bestCount===1){
    for(const preferred of ['248,248,244','242,231,196']){
      if(count.has(preferred)){bestKey=preferred;break;}
    }
  }
  return mappedColor(bestKey.split(',').map(Number));
}

function faceBounds(f){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of f.plan){
    minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);
    minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);
  }
  return {minX,maxX,minY,maxY,dx:maxX-minX,dy:maxY-minY};
}

function toTexturePixel(p,b,size=TEXTURE_SIZE,pad=TEXTURE_PAD){
  const inner=size-2*pad;
  const u=(p[0]-b.minX)/b.dx;
  const v=(p[1]-b.minY)/b.dy;
  return [pad+u*inner,size-pad-v*inner];
}

function nearestPaletteColor(r,g,b){
  let best=DISPLAY_COLORS[0],bestD=Infinity;
  for(const c of DISPLAY_COLORS){
    const dr=r-c[0],dg=g-c[1],db=b-c[2];
    const d=dr*dr+dg*dg+db*db;
    if(d<bestD){bestD=d;best=c;}
  }
  return best;
}

const FLAPS_BY_FACE=new Map();
for(const flap of (DATA.scissorFlaps || [])){
  if(!FLAPS_BY_FACE.has(flap.face))FLAPS_BY_FACE.set(flap.face,[]);
  FLAPS_BY_FACE.get(flap.face).push(flap);
}
const faceTextureByName=new Map();

function makeTextureFromCanvas(canvas){
  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=THREE.ClampToEdgeWrapping;
  texture.wrapT=THREE.ClampToEdgeWrapping;
  texture.magFilter=THREE.LinearFilter;
  texture.minFilter=THREE.LinearMipmapLinearFilter;
  texture.generateMipmaps=true;
  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return texture;
}

function buildFaceTextures(f,b){
  const size=TEXTURE_SIZE;
  const base=document.createElement('canvas');
  base.width=size;base.height=size;
  const ctx=base.getContext('2d',{willReadFrequently:true});
  ctx.clearRect(0,0,size,size);
  ctx.lineJoin='round';

  for(const tri of f.triangles){
    const rgb=dominantColor(f.colors,tri);
    const a=toTexturePixel(f.plan[tri[0]],b);
    const c=toTexturePixel(f.plan[tri[1]],b);
    const d=toTexturePixel(f.plan[tri[2]],b);
    ctx.fillStyle=`rgb(${rgb[0]} ${rgb[1]} ${rgb[2]})`;
    ctx.strokeStyle=ctx.fillStyle;
    ctx.lineWidth=1.15;
    ctx.beginPath();
    ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();
    ctx.fill();ctx.stroke();
  }

  const softened=document.createElement('canvas');
  softened.width=size;softened.height=size;
  const sctx=softened.getContext('2d',{willReadFrequently:true});
  const blurRadius=Math.max(3,Math.round(size/(DATA.meta.meshResolution*2.2)));
  sctx.filter=`blur(${blurRadius}px)`;
  sctx.drawImage(base,0,0);
  sctx.filter='none';

  const original=ctx.getImageData(0,0,size,size);
  const image=sctx.getImageData(0,0,size,size);
  const od=original.data,id=image.data;
  for(let i=0;i<id.length;i+=4){
    const alpha=od[i+3];
    if(alpha===0){id[i+3]=0;continue;}
    if(id[i+3]<250){
      id[i]=od[i];id[i+1]=od[i+1];id[i+2]=od[i+2];id[i+3]=alpha;
      continue;
    }
    const c=nearestPaletteColor(id[i],id[i+1],id[i+2]);
    id[i]=c[0];id[i+1]=c[1];id[i+2]=c[2];id[i+3]=alpha;
  }
  sctx.putImageData(image,0,0);

  // Textura integral: é a "folha" antes do corte e também a textura
  // que viaja rigidamente com cada peça de tesoura.
  const fullCanvas=document.createElement('canvas');
  fullCanvas.width=size;fullCanvas.height=size;
  fullCanvas.getContext('2d').drawImage(softened,0,0);

  // Textura recortada: as regiões que serão transferidas são realmente
  // removidas. As peças móveis ocupam esses vazios no instante inicial;
  // quando giram, os buracos aparecem sem falsificar a geometria.
  const cutCanvas=document.createElement('canvas');
  cutCanvas.width=size;cutCanvas.height=size;
  const cctx=cutCanvas.getContext('2d');
  cctx.drawImage(softened,0,0);
  cctx.save();
  cctx.globalCompositeOperation='destination-out';
  cctx.lineJoin='round';
  cctx.lineWidth=3.0;
  for(const flap of (FLAPS_BY_FACE.get(f.name) || [])){
    for(const tri of flap.triangles){
      const p0=toTexturePixel(tri.start[0],b);
      const p1=toTexturePixel(tri.start[1],b);
      const p2=toTexturePixel(tri.start[2],b);
      cctx.beginPath();
      cctx.moveTo(p0[0],p0[1]);cctx.lineTo(p1[0],p1[1]);cctx.lineTo(p2[0],p2[1]);cctx.closePath();
      cctx.fill();cctx.stroke();
    }
  }
  cctx.restore();

  return {full:makeTextureFromCanvas(fullCanvas),cut:makeTextureFromCanvas(cutCanvas)};
}

function vec(a){return new THREE.Vector3(a[0],a[1],a[2]);}
function putXYZ(out,k,p){out[k]=p[0];out[k+1]=p[1];out[k+2]=p[2];}

/* ---------------------------------------------------------------
   PLANIFICAÇÃO -> TETRAEDRO
   A face central permanece rígida. As outras três faces giram, também
   rigidamente, em torno das arestas comuns com a face central.
---------------------------------------------------------------- */
const CENTRAL_FACE = DATA.faces.find(f=>f.name==='central') || DATA.faces[0];

function cornerIndex(face,vertexId){
  const target=vec(DATA.V3[vertexId]);
  let best=0,bestD=Infinity;
  for(let i=0;i<face.tetra.length;i++){
    const p=face.tetra[i];
    const dx=p[0]-target.x,dy=p[1]-target.y,dz=p[2]-target.z;
    const d=dx*dx+dy*dy+dz*dz;
    if(d<bestD){bestD=d;best=i;}
  }
  return best;
}
function corner(face,vertexId,field){return vec(face[field][cornerIndex(face,vertexId)]);}

const cids=CENTRAL_FACE.idx3d;
const cp0=corner(CENTRAL_FACE,cids[0],'plan');
const cp1=corner(CENTRAL_FACE,cids[1],'plan');
const cp2=corner(CENTRAL_FACE,cids[2],'plan');
const cq0=vec(DATA.V3[cids[0]]);
const cq1=vec(DATA.V3[cids[1]]);
const cq2=vec(DATA.V3[cids[2]]);

const px=cp1.clone().sub(cp0).normalize();
const pz=cp1.clone().sub(cp0).cross(cp2.clone().sub(cp0)).normalize();
const py=pz.clone().cross(px).normalize();
const qx=cq1.clone().sub(cq0).normalize();
const qzMap=cq1.clone().sub(cq0).cross(cq2.clone().sub(cq0)).normalize();
const qyMap=qzMap.clone().cross(qx).normalize();
const basisP=new THREE.Matrix4().makeBasis(px,py,pz);
const basisQ=new THREE.Matrix4().makeBasis(qx,qyMap,qzMap);
const flatRotationMatrix=new THREE.Matrix4().multiplyMatrices(basisQ,basisP.clone().invert());
const FLAT_ROTATION=new THREE.Quaternion().setFromRotationMatrix(flatRotationMatrix);
const FLAT_SCALE=cq0.distanceTo(cq1)/cp0.distanceTo(cp1);
const FLAT_TRANSLATION=cq0.clone().sub(cp0.clone().applyQuaternion(FLAT_ROTATION).multiplyScalar(FLAT_SCALE));

let FLAT_NORMAL=qzMap.clone();
const centralCentroid=cq0.clone().add(cq1).add(cq2).multiplyScalar(1/3);
if(FLAT_NORMAL.dot(centralCentroid)<0) FLAT_NORMAL.negate();
const FLAT_UP=py.clone().applyQuaternion(FLAT_ROTATION).normalize();

function planToFlatWorld(p){
  return vec(p).applyQuaternion(FLAT_ROTATION).multiplyScalar(FLAT_SCALE).add(FLAT_TRANSLATION);
}

const foldMetaByName=new Map();
for(const f of DATA.faces){
  if(f===CENTRAL_FACE || f.name==='central'){
    foldMetaByName.set(f.name,{central:true,angle:0,normalSign:1});
    continue;
  }
  const shared=f.idx3d.filter(id=>CENTRAL_FACE.idx3d.includes(id));
  const third=f.idx3d.find(id=>!shared.includes(id));
  if(shared.length!==2 || third===undefined) throw new Error(`Dobradiça não identificada em ${f.name}.`);

  const hingeA=planToFlatWorld(corner(f,shared[0],'plan').toArray());
  const hingeB=planToFlatWorld(corner(f,shared[1],'plan').toArray());
  const axis=hingeB.clone().sub(hingeA).normalize();
  const thirdFlat=planToFlatWorld(corner(f,third,'plan').toArray());
  const thirdTarget=vec(DATA.V3[third]);

  const va=thirdFlat.clone().sub(hingeA).addScaledVector(axis,-thirdFlat.clone().sub(hingeA).dot(axis)).normalize();
  const vb=thirdTarget.clone().sub(hingeA).addScaledVector(axis,-thirdTarget.clone().sub(hingeA).dot(axis)).normalize();
  const angle=Math.atan2(axis.dot(va.clone().cross(vb)),THREE.MathUtils.clamp(va.dot(vb),-1,1));

  // Garante que um pequeno afastamento visual da costura fique sempre
  // para o lado externo da face, não para dentro do tetraedro.
  const rotFull=new THREE.Quaternion().setFromAxisAngle(axis,angle);
  const foldedNormal=FLAT_NORMAL.clone().applyQuaternion(rotFull).normalize();
  const qa=vec(DATA.V3[f.idx3d[0]]),qb=vec(DATA.V3[f.idx3d[1]]),qc=vec(DATA.V3[f.idx3d[2]]);
  const outward=qb.clone().sub(qa).cross(qc.clone().sub(qa)).normalize();
  const centroid=qa.clone().add(qb).add(qc).multiplyScalar(1/3);
  if(outward.dot(centroid)<0) outward.negate();
  const normalSign=foldedNormal.dot(outward)>=0 ? 1 : -1;
  foldMetaByName.set(f.name,{central:false,hingeA,axis,angle,normalSign});
}

function foldPoint(p,meta,t,normalOffset=0){
  if(meta.central || Math.abs(meta.angle)<1e-12){
    return p.clone().addScaledVector(FLAT_NORMAL,normalOffset*(meta.normalSign ?? 1));
  }
  const q=p.clone().sub(meta.hingeA);
  const rot=new THREE.Quaternion().setFromAxisAngle(meta.axis,meta.angle*t);
  const n=FLAT_NORMAL.clone().applyQuaternion(rot);
  return q.applyQuaternion(rot).add(meta.hingeA).addScaledVector(n,normalOffset*(meta.normalSign ?? 1));
}

function foldArrayInto(attr,flat,meta,t,normalOffset=0){
  const out=attr.array;
  for(let i=0;i<out.length;i+=3){
    const p=new THREE.Vector3(flat[i],flat[i+1],flat[i+2]);
    const q=foldPoint(p,meta,t,normalOffset);
    out[i]=q.x;out[i+1]=q.y;out[i+2]=q.z;
  }
  attr.needsUpdate=true;
}

function buildFaceGeometry(f){
  const nTri=f.triangles.length;
  const flatPlan=new Float32Array(nTri*9);
  const tetra=new Float32Array(nTri*9);
  const sphere=new Float32Array(nTri*9);
  const uv=new Float32Array(nTri*6);
  const bounds=faceBounds(f);
  const pad=TEXTURE_PAD/TEXTURE_SIZE;
  const inner=1-2*pad;

  let k=0,kuv=0;
  for(const tri of f.triangles){
    for(const idx of tri){
      const p=f.plan[idx];
      const fp=planToFlatWorld(p);
      flatPlan[k]=fp.x;flatPlan[k+1]=fp.y;flatPlan[k+2]=fp.z;
      putXYZ(tetra,k,f.tetra[idx]);
      putXYZ(sphere,k,f.sphere[idx]);
      uv[kuv++]=pad+((p[0]-bounds.minX)/bounds.dx)*inner;
      uv[kuv++]=pad+((p[1]-bounds.minY)/bounds.dy)*inner;
      k+=3;
    }
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(flatPlan.slice(),3));
  geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  geometry.computeVertexNormals();
  geometry.userData={flatPlan,tetra,sphere,foldMeta:foldMetaByName.get(f.name)};

  const textures=buildFaceTextures(f,bounds);
  faceTextureByName.set(f.name,textures.full);
  const material=new THREE.MeshLambertMaterial({
    map:textures.cut,
    color:0xffffff,
    side:THREE.DoubleSide,
    alphaTest:0.38
  });

  const mesh=new THREE.Mesh(geometry,material);
  root.add(mesh);
  faceMeshes.push(mesh);
}
for(const f of DATA.faces) buildFaceGeometry(f);

const FLAT_NET_BOX=new THREE.Box3();
for(const f of DATA.faces) for(const p of f.plan) FLAT_NET_BOX.expandByPoint(planToFlatWorld(p));
const FLAT_NET_CENTER=FLAT_NET_BOX.getCenter(new THREE.Vector3());
const FLAT_NET_SIZE=FLAT_NET_BOX.getSize(new THREE.Vector3());
const FLAT_VIEW_DISTANCE=Math.max(4.8,FLAT_NET_SIZE.length()*1.52);

/* ---------------------------------------------------------------
   COSTURAS CURVILÍNEAS
   As curvas já nascem recortadas dentro da planificação. Nenhum
   trecho é desenhado fora de sua carta triangular. Cada fragmento é
   parte da fronteira de um painel curvilíneo. Durante a primeira
   etapa ela acompanha rigidamente a dobra dessa carta; depois é levada
   à esfera pela mesma parametrização usada na superfície.

   Assim, a linha permanece sobre a superfície durante toda a animação;
   o pequeno SEAM_OFFSET serve apenas para evitar z-fighting no WebGL.
---------------------------------------------------------------- */
const SEAM_OFFSET=0.0014;

function faceOutwardNormal(face){
  const a=vec(DATA.V3[face.idx3d[0]]);
  const b=vec(DATA.V3[face.idx3d[1]]);
  const c=vec(DATA.V3[face.idx3d[2]]);
  const n=b.clone().sub(a).cross(c.clone().sub(a)).normalize();
  const center=a.clone().add(b).add(c).multiplyScalar(1/3);
  if(n.dot(center)<0)n.negate();
  return n;
}

function offsetTetraArray(arr,face,amount){
  const n=faceOutwardNormal(face);
  const out=new Float32Array(arr.length*3);
  let k=0;
  for(const p0 of arr){
    const p=vec(p0).addScaledVector(n,amount);
    out[k++]=p.x;out[k++]=p.y;out[k++]=p.z;
  }
  return out;
}

function offsetSphereArray(arr,amount){
  const out=new Float32Array(arr.length*3);
  let k=0;
  for(const p0 of arr){
    const p=vec(p0).normalize().multiplyScalar(1+amount);
    out[k++]=p.x;out[k++]=p.y;out[k++]=p.z;
  }
  return out;
}

for(const seam of (DATA.curvedSeams || [])){
  const face=DATA.faces.find(f=>f.name===seam.face);
  if(!face)continue;

  const flatPlan=new Float32Array(seam.plan.length*3);
  let k=0;
  for(const p0 of seam.plan){
    const p=planToFlatWorld(p0);
    flatPlan[k++]=p.x;flatPlan[k++]=p.y;flatPlan[k++]=p.z;
  }

  const tetra=offsetTetraArray(seam.tetra,face,SEAM_OFFSET);
  const sphere=offsetSphereArray(seam.sphere,SEAM_OFFSET);
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(flatPlan.slice(),3));
  geometry.userData={
    flatPlan,
    tetra,
    sphere,
    foldMeta:foldMetaByName.get(face.name)
  };

  const material=new THREE.LineBasicMaterial({
    color:0x000000,
    transparent:true,
    opacity:1.0,
    depthTest:true,
    depthWrite:false
  });
  const line=new THREE.Line(geometry,material);
  line.visible=false;
  line.renderOrder=7;
  root.add(line);
  seamLines.push(line);
}


/* ---------------------------------------------------------------
   CORTE DE TESOURA — NOVA SUPERFÍCIE

   Não existem "abas auxiliares" que desaparecem. Cada região recortada
   é material da própria superfície. No começo ela ocupa o buraco de onde
   foi retirada. Em seguida faz a meia-volta plana de 180 graus. Depois,
   já na nova posição externa, dobra para a carta tetraédrica adjacente e
   finalmente é transportada para a esfera.

   A textura usa as coordenadas da posição ORIGINAL da peça. Portanto o
   desenho gira com a peça, em vez de ser repintado após a rotação.
---------------------------------------------------------------- */
const SCISSOR_OFFSET=0.0011;

function flatFromPlanArray(arr,offset=SCISSOR_OFFSET){
  const out=new Float32Array(arr.length*3);
  let k=0;
  for(const p0 of arr){
    const p=planToFlatWorld(p0).addScaledVector(FLAT_NORMAL,offset);
    out[k++]=p.x;out[k++]=p.y;out[k++]=p.z;
  }
  return out;
}

function rotateFlatArrayInto(attr,startFlat,center,t){
  const out=attr.array;
  const q=new THREE.Quaternion().setFromAxisAngle(FLAT_NORMAL,Math.PI*t);
  for(let i=0;i<out.length;i+=3){
    const p=new THREE.Vector3(startFlat[i],startFlat[i+1],startFlat[i+2]);
    p.sub(center).applyQuaternion(q).add(center);
    out[i]=p.x;out[i+1]=p.y;out[i+2]=p.z;
  }
  attr.needsUpdate=true;
}

function makeTransferredRigidMeta(flap){
  const target=DATA.faces.find(f=>f.name===flap.targetFace);
  if(!target)throw new Error(`Carta de destino não encontrada: ${flap.targetFace}`);

  const A=planToFlatWorld(flap.hinge[0]);
  const B=planToFlatWorld(flap.hinge[1]);
  const C=planToFlatWorld(flap.virtualThird);
  const A2=vec(DATA.V3[flap.edgeVertices[0]]);
  const B2=vec(DATA.V3[flap.edgeVertices[1]]);
  const C2=vec(DATA.V3[flap.targetThirdVertex]);

  function basis(a,b,c){
    const x=b.clone().sub(a).normalize();
    const z=b.clone().sub(a).cross(c.clone().sub(a)).normalize();
    const y=z.clone().cross(x).normalize();
    return new THREE.Matrix4().makeBasis(x,y,z);
  }

  const srcBasis=basis(A,B,C);
  const dstBasis=basis(A2,B2,C2);
  const R=new THREE.Matrix4().multiplyMatrices(dstBasis,srcBasis.clone().invert());
  const rotation=new THREE.Quaternion().setFromRotationMatrix(R);
  const translation=A2.clone().sub(A.clone().applyQuaternion(rotation));
  return {rotation,translation,targetFace:target.name};
}

function transformRigidArrayInto(attr,startFlat,meta,t){
  const u=THREE.MathUtils.clamp(t,0,1);
  const q=new THREE.Quaternion().identity().slerp(meta.rotation,u);
  const tr=meta.translation.clone().multiplyScalar(u);
  const out=attr.array;
  for(let i=0;i<out.length;i+=3){
    const p=new THREE.Vector3(startFlat[i],startFlat[i+1],startFlat[i+2]);
    p.applyQuaternion(q).add(tr);
    out[i]=p.x;out[i+1]=p.y;out[i+2]=p.z;
  }
  attr.needsUpdate=true;
}

function uvForPoint(p,b){
  const pad=TEXTURE_PAD/TEXTURE_SIZE;
  const inner=1-2*pad;
  return [pad+((p[0]-b.minX)/b.dx)*inner,pad+((p[1]-b.minY)/b.dy)*inner];
}

for(const flap of (DATA.scissorFlaps || [])){
  const face=DATA.faces.find(f=>f.name===flap.face);
  if(!face)continue;
  const bounds=faceBounds(face);
  const nTri=flap.triangles.length;
  const startFlat=new Float32Array(nTri*9);
  const endFlat=new Float32Array(nTri*9);
  const sourceTetra=new Float32Array(nTri*9);
  const sourceSphere=new Float32Array(nTri*9);
  const uv=new Float32Array(nTri*6);
  const sourceFoldMeta=foldMetaByName.get(face.name);
  let k=0,ku=0;
  for(const tri of flap.triangles){
    for(let j=0;j<3;j++){
      const ps=planToFlatWorld(tri.start[j]).addScaledVector(FLAT_NORMAL,SCISSOR_OFFSET);
      const pe=planToFlatWorld(tri.end[j]).addScaledVector(FLAT_NORMAL,SCISSOR_OFFSET);
      startFlat[k]=ps.x;startFlat[k+1]=ps.y;startFlat[k+2]=ps.z;
      endFlat[k]=pe.x;endFlat[k+1]=pe.y;endFlat[k+2]=pe.z;

      // Depois que a meia-volta é desfeita, a peça volta a pertencer
      // à sua carta ORIGINAL. É essa carta que dobra para o tetraedro.
      const tp=foldPoint(ps,sourceFoldMeta,1,0);
      sourceTetra[k]=tp.x;sourceTetra[k+1]=tp.y;sourceTetra[k+2]=tp.z;

      const sp=vec(tri.sourceSphere[j]).multiplyScalar(1+SCISSOR_OFFSET);
      sourceSphere[k]=sp.x;sourceSphere[k+1]=sp.y;sourceSphere[k+2]=sp.z;

      const tuv=uvForPoint(tri.start[j],bounds);
      uv[ku++]=tuv[0];uv[ku++]=tuv[1];
      k+=3;
    }
  }
  const h0=planToFlatWorld(flap.hinge[0]);
  const h1=planToFlatWorld(flap.hinge[1]);
  const center=h0.clone().add(h1).multiplyScalar(0.5).addScaledVector(FLAT_NORMAL,SCISSOR_OFFSET);

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(endFlat.slice(),3));
  geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  geometry.computeVertexNormals();
  geometry.userData={startFlat,endFlat,sourceTetra,sourceSphere,center,sourceFoldMeta};

  const material=new THREE.MeshLambertMaterial({
    map:faceTextureByName.get(face.name),
    color:0xffffff,
    side:THREE.DoubleSide
  });
  const mesh=new THREE.Mesh(geometry,material);
  mesh.renderOrder=5;
  root.add(mesh);
  scissorMeshes.push(mesh);

  for(const seg of flap.curveSegments){
    const segStart=flatFromPlanArray(seg.start,SCISSOR_OFFSET*1.7);
    const segEnd=flatFromPlanArray(seg.end,SCISSOR_OFFSET*1.7);
    const segSourceTetra=new Float32Array(seg.start.length*3);
    const segSourceSphere=new Float32Array(seg.start.length*3);
    let j=0;
    for(let i=0;i<seg.start.length;i++){
      const p=new THREE.Vector3(segStart[j],segStart[j+1],segStart[j+2]);
      const tp=foldPoint(p,sourceFoldMeta,1,0);
      segSourceTetra[j]=tp.x;segSourceTetra[j+1]=tp.y;segSourceTetra[j+2]=tp.z;
      const sp=vec(seg.sourceSphere[i]).multiplyScalar(1+SEAM_OFFSET);
      segSourceSphere[j]=sp.x;segSourceSphere[j+1]=sp.y;segSourceSphere[j+2]=sp.z;
      j+=3;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(segEnd.slice(),3));
    g.userData={startFlat:segStart,endFlat:segEnd,sourceTetra:segSourceTetra,sourceSphere:segSourceSphere,center,sourceFoldMeta};
    const m=new THREE.LineBasicMaterial({
      color:0x000000,transparent:true,opacity:1.0,
      depthTest:true,depthWrite:false
    });
    const line=new THREE.Line(g,m);
    line.renderOrder=8;
    root.add(line);
    scissorCurveLines.push(line);
  }
}

/* ---------------------------------------------------------------
   DOBRAS / ARESTAS AUXILIARES DA PARAMETRIZAÇÃO TETRAÉDRICA
   Estas linhas explicam a planificação e a dobradura, mas não são
   costuras físicas da bola. Por isso desaparecem durante a passagem
   do tetraedro para a esfera.
---------------------------------------------------------------- */
function sampledEdgeArrays(face,ia,ib,n=34){
  const pa=corner(face,ia,'plan'),pb=corner(face,ib,'plan');
  const va=vec(DATA.V3[ia]),vb=vec(DATA.V3[ib]);
  const flat=new Float32Array(n*3);
  const tetra=new Float32Array(n*3);
  const sphere=new Float32Array(n*3);
  let k=0;
  for(let j=0;j<n;j++){
    const t=j/(n-1);
    const pp=pa.clone().lerp(pb,t);
    const fp=planToFlatWorld(pp.toArray()).addScaledVector(FLAT_NORMAL,0.0010);
    const tp=va.clone().lerp(vb,t);
    const sp=tp.clone().normalize().multiplyScalar(1.0010);
    flat[k]=fp.x;flat[k+1]=fp.y;flat[k+2]=fp.z;
    tetra[k]=tp.x;tetra[k+1]=tp.y;tetra[k+2]=tp.z;
    sphere[k]=sp.x;sphere[k+1]=sp.y;sphere[k+2]=sp.z;
    k+=3;
  }
  return {flat,tetra,sphere};
}

for(const face of DATA.faces){
  const ids=face.idx3d;
  for(const [a,b] of [[0,1],[1,2],[2,0]]){
    const e=sampledEdgeArrays(face,ids[a],ids[b]);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(e.flat.slice(),3));
    g.userData={flatPlan:e.flat,tetra:e.tetra,sphere:e.sphere,foldMeta:foldMetaByName.get(face.name)};
    const m=new THREE.LineDashedMaterial({
      color:0x80858b,dashSize:0.035,gapSize:0.022,
      transparent:true,opacity:0.52,depthTest:true,depthWrite:false
    });
    const line=new THREE.Line(g,m);
    line.computeLineDistances();
    line.renderOrder=6;
    root.add(line);
    foldGuideLines.push(line);
  }
}

/* ---------------------------------------------------------------
   VÉRTICES v1,...,v4
   Cores iguais às usadas no código Python.
---------------------------------------------------------------- */
const VERTEX_COLORS=[0x315fd4,0x2bb673,0xe53935,0xd4af37];

function makeTextSprite(text){
  const canvas=document.createElement('canvas');
  canvas.width=256;canvas.height=128;
  const ctx=canvas.getContext('2d');
  ctx.font='700 58px system-ui, sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=10;ctx.strokeStyle='rgba(255,255,255,.92)';ctx.strokeText(text,128,64);
  ctx.fillStyle='#202124';ctx.fillText(text,128,64);
  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true,depthTest:false,toneMapped:false}));
  sprite.scale.set(0.26,0.13,0.13);
  return sprite;
}

for(let vid=0;vid<4;vid++){
  const f=(vid<3?CENTRAL_FACE:DATA.faces.find(face=>face.idx3d.includes(vid))) || DATA.faces[0];
  const idx=cornerIndex(f,vid);
  const flat=planToFlatWorld(f.plan[idx]);
  const tetra=vec(f.tetra[idx]);
  const sphere=vec(f.sphere[idx]);
  const group=new THREE.Group();
  const dot=new THREE.Mesh(
    new THREE.SphereGeometry(0.035,20,14),
    new THREE.MeshBasicMaterial({color:VERTEX_COLORS[vid],depthTest:true})
  );
  const halo=new THREE.Mesh(
    new THREE.SphereGeometry(0.041,20,14),
    new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.BackSide,depthTest:true})
  );
  const label=makeTextSprite(`v${vid+1}`);
  label.position.set(0,0.085,0);
  group.add(halo,dot,label);
  group.position.copy(flat);
  group.visible=false;
  group.renderOrder=9;
  root.add(group);
  vertexMarkers.push({group,flat,tetra,sphere,foldMeta:foldMetaByName.get(f.name)});
}

function smooth(t){return t*t*(3-2*t);}
function mixPositions(attr,a,b,t){
  const out=attr.array,u=1-t;
  for(let i=0;i<out.length;i++) out[i]=u*a[i]+t*b[i];
  attr.needsUpdate=true;
}
function mixPoint(a,b,t){return a.clone().lerp(b,t);}

const RETURN_END=0.20;
const NET_END=0.32;
const TETRA_END=0.62;

function labelFor(v){
  const s=Number(v)/100;
  if(s<0.02)return 'Arranjo dos logos — corte de tesoura';
  if(s<RETURN_END-0.02)return 'Desfazendo as meia-voltas';
  if(s<RETURN_END+0.02)return 'Triângulo maior recomposto';
  if(s<NET_END-0.02)return 'Triângulo maior — revelando a planificação';
  if(s<NET_END+0.02)return 'Planificação tetraédrica';
  if(s<TETRA_END-0.02)return 'Planificação → tetraedro';
  if(s<TETRA_END+0.02)return 'Tetraedro';
  if(s<0.98)return 'Tetraedro → esfera';
  return 'Esfera';
}

/* A animação agora começa no ARRANJO recortado. As peças externas
   desfazem a meia-volta e regressam aos buracos, reconstruindo o
   triângulo maior. Só depois revelamos as dobras tetraédricas. */
function setTransferredReturn(t){
  const u=THREE.MathUtils.clamp(t,0,1);
  const rotationAmount=1-u; // 0%: peça fora; 100%: peça de volta ao triângulo
  for(const mesh of scissorMeshes){
    const d=mesh.geometry.userData;
    rotateFlatArrayInto(mesh.geometry.attributes.position,d.startFlat,d.center,rotationAmount);
    mesh.geometry.computeVertexNormals();
    mesh.geometry.attributes.normal.needsUpdate=true;
    mesh.visible=true;
  }
  for(const line of scissorCurveLines){
    const d=line.geometry.userData;
    rotateFlatArrayInto(line.geometry.attributes.position,d.startFlat,d.center,rotationAmount);
    line.material.opacity=showSeams?1.0:0;
    line.visible=showSeams;
  }
}

function setTransferredOriginalFold(t){
  const u=THREE.MathUtils.clamp(t,0,1);
  for(const mesh of scissorMeshes){
    const d=mesh.geometry.userData;
    foldArrayInto(mesh.geometry.attributes.position,d.startFlat,d.sourceFoldMeta,u,0);
    mesh.geometry.computeVertexNormals();
    mesh.geometry.attributes.normal.needsUpdate=true;
    mesh.visible=true;
  }
  for(const line of scissorCurveLines){
    const d=line.geometry.userData;
    foldArrayInto(line.geometry.attributes.position,d.startFlat,d.sourceFoldMeta,u,0);
    line.material.opacity=showSeams?1.0:0;
    line.visible=showSeams;
  }
}

function setTransferredOriginalSphere(t){
  const u=THREE.MathUtils.clamp(t,0,1);
  for(const mesh of scissorMeshes){
    const d=mesh.geometry.userData;
    mixPositions(mesh.geometry.attributes.position,d.sourceTetra,d.sourceSphere,u);
    mesh.geometry.computeVertexNormals();
    mesh.geometry.attributes.normal.needsUpdate=true;
    mesh.visible=true;
  }
  for(const line of scissorCurveLines){
    const d=line.geometry.userData;
    mixPositions(line.geometry.attributes.position,d.sourceTetra,d.sourceSphere,u);
    line.material.opacity=showSeams?1.0:0;
    line.visible=showSeams;
  }
}

function setFoldGuideOpacity(opacity){
  for(const line of foldGuideLines){
    line.material.opacity=showFolds?opacity:0;
    line.visible=showFolds && opacity>0.004;
  }
}

function setFinalSeamOpacity(opacity){
  for(const line of seamLines){
    line.material.opacity=showSeams?opacity:0;
    line.visible=showSeams && opacity>0.01;
  }
}

function setBaseSeamsFlat(){
  for(const line of seamLines){
    const d=line.geometry.userData;
    line.geometry.attributes.position.array.set(d.flatPlan);
    line.geometry.attributes.position.needsUpdate=true;
  }
}

function setBaseSeamsFold(t){
  for(const line of seamLines){
    const d=line.geometry.userData;
    foldArrayInto(line.geometry.attributes.position,d.flatPlan,d.foldMeta,t,SEAM_OFFSET);
  }
}

function setBaseSeamsSphere(t){
  for(const line of seamLines){
    const d=line.geometry.userData;
    mixPositions(line.geometry.attributes.position,d.tetra,d.sphere,t);
  }
}

function updateMorph(raw){
  const v=Number(raw),s=v/100;
  percent.textContent=`${Math.round(v)}%`;
  stage.textContent=labelFor(v);

  /* -------------------------------------------------------------
     1) ARRANJO -> TRIÂNGULO MAIOR
     As peças externas regressam por meia-volta aos lugares de onde
     foram cortadas. O desenho passa da união curvilínea ao domínio
     triangular completo.
  ------------------------------------------------------------- */
  if(s<=RETURN_END){
    const rt=smooth(s/RETURN_END);

    for(const mesh of faceMeshes){
      const d=mesh.geometry.userData;
      foldArrayInto(mesh.geometry.attributes.position,d.flatPlan,d.foldMeta,0,0);
      mesh.geometry.computeVertexNormals();
      mesh.geometry.attributes.normal.needsUpdate=true;
    }
    setTransferredReturn(rt);
    setBaseSeamsFlat();
    setFinalSeamOpacity(1.0);

    for(const m of vertexMarkers){
      m.group.position.copy(foldPoint(m.flat,m.foldMeta,0,0.010));
    }
    for(const line of foldGuideLines){
      const d=line.geometry.userData;
      foldArrayInto(line.geometry.attributes.position,d.flatPlan,d.foldMeta,0,0.0010);
      line.computeLineDistances();
    }
    setFoldGuideOpacity(0);

  /* -------------------------------------------------------------
     2) TRIÂNGULO MAIOR -> PLANIFICAÇÃO TETRAÉDRICA
     A geometria não se move. Apenas surgem progressivamente as
     linhas de subdivisão que mostram as quatro cartas triangulares.
  ------------------------------------------------------------- */
  }else if(s<=NET_END){
    const nt=smooth((s-RETURN_END)/(NET_END-RETURN_END));

    for(const mesh of faceMeshes){
      const d=mesh.geometry.userData;
      foldArrayInto(mesh.geometry.attributes.position,d.flatPlan,d.foldMeta,0,0);
      mesh.geometry.computeVertexNormals();
      mesh.geometry.attributes.normal.needsUpdate=true;
    }
    setTransferredOriginalFold(0);
    setBaseSeamsFlat();
    setFinalSeamOpacity(1.0);

    for(const m of vertexMarkers){
      m.group.position.copy(foldPoint(m.flat,m.foldMeta,0,0.010));
    }
    for(const line of foldGuideLines){
      const d=line.geometry.userData;
      foldArrayInto(line.geometry.attributes.position,d.flatPlan,d.foldMeta,0,0.0010);
      line.computeLineDistances();
    }
    setFoldGuideOpacity(0.58*nt);

  /* -------------------------------------------------------------
     3) PLANIFICAÇÃO -> TETRAEDRO
     Agora todas as partes — inclusive as que tinham sido usadas no
     corte de tesoura — pertencem novamente às suas cartas originais
     e dobram rigidamente com elas.
  ------------------------------------------------------------- */
  }else if(s<=TETRA_END){
    const ft=smooth((s-NET_END)/(TETRA_END-NET_END));

    for(const mesh of faceMeshes){
      const d=mesh.geometry.userData;
      foldArrayInto(mesh.geometry.attributes.position,d.flatPlan,d.foldMeta,ft,0);
      mesh.geometry.computeVertexNormals();
      mesh.geometry.attributes.normal.needsUpdate=true;
    }
    setTransferredOriginalFold(ft);
    setBaseSeamsFold(ft);
    setFinalSeamOpacity(1.0);

    for(const m of vertexMarkers){
      m.group.position.copy(foldPoint(m.flat,m.foldMeta,ft,0.010));
    }
    for(const line of foldGuideLines){
      const d=line.geometry.userData;
      foldArrayInto(line.geometry.attributes.position,d.flatPlan,d.foldMeta,ft,0.0010);
      line.computeLineDistances();
    }
    setFoldGuideOpacity(0.58);

  /* -------------------------------------------------------------
     4) TETRAEDRO -> ESFERA
     As costuras curvas permanecem pretas e visíveis. As dobras e
     uniões tetraédricas são apenas auxiliares e desaparecem de forma
     contínua até chegarem a opacidade zero na esfera.
  ------------------------------------------------------------- */
  }else{
    const st=smooth((s-TETRA_END)/(1-TETRA_END));

    for(const mesh of faceMeshes){
      const d=mesh.geometry.userData;
      mixPositions(mesh.geometry.attributes.position,d.tetra,d.sphere,st);
      mesh.geometry.computeVertexNormals();
      mesh.geometry.attributes.normal.needsUpdate=true;
    }
    setTransferredOriginalSphere(st);
    setBaseSeamsSphere(st);
    setFinalSeamOpacity(1.0);

    for(const m of vertexMarkers){
      m.group.position.copy(mixPoint(m.tetra,m.sphere,st).multiplyScalar(1.012));
    }

    // As dobras podem ser ligadas/desligadas pelo usuário, mas mesmo
    // quando ligadas desaparecem necessariamente na esfera final.
    const guideFade=1-smooth(THREE.MathUtils.clamp(st/0.72,0,1));
    for(const line of foldGuideLines){
      const d=line.geometry.userData;
      mixPositions(line.geometry.attributes.position,d.tetra,d.sphere,st);
      line.computeLineDistances();
    }
    setFoldGuideOpacity(0.58*guideFade);
  }
}

function setViewFor(value){
  const v=Number(value);
  if(v<36){
    controls.target.copy(FLAT_NET_CENTER);
    camera.up.copy(FLAT_UP);
    camera.position.copy(FLAT_NET_CENTER).addScaledVector(FLAT_NORMAL,FLAT_VIEW_DISTANCE);
  }else{
    controls.target.set(0,0,0);
    camera.up.set(0,0,1);
    camera.position.copy(new THREE.Vector3(1.45,1.35,1.10).normalize().multiplyScalar(3.15));
  }
  camera.lookAt(controls.target);
  controls.update();
}

  vertexMarkers.forEach(m=>m.group.visible=showVertices);
  verticesButton.textContent=`Vértices: ${showVertices?'sim':'não'}`;
  verticesButton.setAttribute('aria-pressed',String(showVertices));
});

resetButton.addEventListener('click',()=>setViewFor(morph.value));

playButton.addEventListener('click',()=>{
  playing=!playing;
  if(playing){
    playFrom=Number(morph.value);
    if(playFrom>=100){playFrom=0;morph.value='0';updateMorph(0);setViewFor(0);}
    playStart=performance.now();
    playButton.textContent='⏸ Pausar';
  }else playButton.textContent='▶ Animar';
});

function resize(){
  const r=host.getBoundingClientRect();
  const w=Math.max(1,r.width),h=Math.max(1,r.height);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  if(typeof controls.handleResize==='function') controls.handleResize();
}
new ResizeObserver(resize).observe(host);

resize();
setViewFor(0);
updateMorph(0);

function animate(now){
  requestAnimationFrame(animate);
  if(playing){
    const duration=13500;
    const elapsed=now-playStart;
    let v=playFrom+(100-playFrom)*(elapsed/duration);
    if(v>=100){v=100;playing=false;playButton.textContent='▶ Animar';}
    morph.value=String(v);
    updateMorph(v);
  }
  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
