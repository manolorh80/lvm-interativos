<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trionda — LVM</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f5f6f7;--panel:#fff;--text:#202124;--muted:#666b73;
      --border:#d7d9dd;--accent:#315fd4
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#111315;--panel:#1d2023;--text:#f3f4f5;--muted:#b3b8bf;--border:#3a3e44;--accent:#88a8ff}
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
    .title{font-weight:750}
    .back{color:var(--text);text-decoration:none;font-size:.92rem}
    .viewer{position:relative;flex:1;min-height:520px}
    .canvas{position:absolute;inset:0}
    .canvas canvas{display:block;width:100%;height:100%}
    .controls{
      position:absolute;left:14px;right:14px;bottom:14px;
      display:grid;grid-template-columns:minmax(180px,1fr) auto;
      gap:12px;align-items:end;padding:12px;border:1px solid var(--border);
      border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);
      backdrop-filter:blur(7px)
    }
    .range-wrap{min-width:0}
    .labels{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem}
    .stage{font-weight:700;margin-bottom:5px}
    .range{width:100%}
    .buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    button{font:inherit;min-height:42px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--panel);color:var(--text);cursor:pointer}
    .primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .hint{
      position:absolute;left:14px;top:14px;max-width:min(520px,calc(100% - 160px));
      padding:9px 11px;border-radius:10px;
      background:color-mix(in srgb,var(--panel) 90%,transparent);
      border:1px solid var(--border);color:var(--muted);font-size:.84rem;pointer-events:none
    }
    .orientation{
      position:absolute;right:14px;top:14px;width:116px;height:116px;
      border:1px solid var(--border);border-radius:14px;
      background:color-mix(in srgb,var(--panel) 84%,transparent);
      backdrop-filter:blur(6px);overflow:hidden;pointer-events:auto
    }
    .orientation::after{
      content:"orientação";position:absolute;left:0;right:0;bottom:4px;
      text-align:center;font-size:.68rem;color:var(--muted);letter-spacing:.02em
    }
    .orientation canvas{display:block;width:100%;height:100%;cursor:pointer}
    @media(max-width:700px){
      .viewer{min-height:600px}
      .controls{grid-template-columns:1fr}
      .buttons{justify-content:flex-start}
      .top{align-items:flex-start;flex-direction:column}
      .orientation{width:92px;height:92px}
      .hint{max-width:calc(100% - 124px)}
      .orientation::after{font-size:.6rem}
    }
  </style>

  <script type="importmap">
  {
    "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <!-- ?v=4 evita que o navegador use uma cópia antiga em cache. -->
  <script src="trionda-data.js?v=5"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="title">Trionda — exploração 3D</div>
      <div style="font-size:.86rem;color:var(--muted)">Planificação → tetraedro → esfera</div>
    </div>
    <a class="back" href="../">← Interativos do LVM</a>
  </header>

  <main class="viewer">
    <div id="canvas-host" class="canvas"></div>

    <div class="hint">
      Arraste com o botão esquerdo: girar · roda/pinça: zoom · botão direito: deslocar
    </div>

    <div id="orientation" class="orientation" aria-label="Indicador dos eixos X, Y e Z"></div>

    <section class="controls" aria-label="Controles da visualização">
      <div class="range-wrap">
        <div id="stage" class="stage">Planificação</div>
        <input id="morph" class="range" type="range" min="0" max="100" step="1" value="0"
               aria-label="Transformação entre planificação, tetraedro e esfera">
        <div class="labels">
          <span>Planificação</span><span id="percent">0%</span><span>Esfera</span>
        </div>
      </div>

      <div class="buttons">
        <button type="button" data-stop="0">Plano</button>
        <button type="button" data-stop="50">Tetraedro</button>
        <button type="button" data-stop="100">Esfera</button>
        <button id="seams" type="button" aria-pressed="true">Costuras: sim</button>
        <button id="reset" type="button">Restaurar vista</button>
        <button id="play" type="button" class="primary">▶ Animar</button>
      </div>
    </section>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = window.TRIONDA_DATA;
if (!DATA) throw new Error('trionda-data.js não foi carregado.');

const host = document.getElementById('canvas-host');
const morph = document.getElementById('morph');
const percent = document.getElementById('percent');
const stage = document.getElementById('stage');
const seamsButton = document.getElementById('seams');
const resetButton = document.getElementById('reset');
const playButton = document.getElementById('play');
const orientationHost = document.getElementById('orientation');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(36,1,0.01,100);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000,0);
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.82;
controls.panSpeed = 0.70;
controls.minDistance = 1.25;
controls.maxDistance = 8;
controls.screenSpacePanning = true;

/* Navegação simples e previsível, como em visualizadores 3D na web:
   - botão esquerdo + arrastar: girar
   - roda/pinça: zoom
   - botão direito + arrastar: deslocar
   - toque: 1 dedo gira; 2 dedos dão zoom/deslocam
*/
controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
controls.touches.ONE = THREE.TOUCH.ROTATE;
controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;

renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

/* Luz muito suave. A cor é mantida quase integral e a luz serve só
   para dar leitura espacial à superfície. */
scene.add(new THREE.AmbientLight(0xffffff,0.92));
const key = new THREE.DirectionalLight(0xffffff,0.28);
key.position.set(3,-2,4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff,0.10);
fill.position.set(-3,2,-1);
scene.add(fill);

const root = new THREE.Group();
scene.add(root);

const faceMeshes = [];
const seamLines = [];
let showSeams = true;
let playing = false;
let playStart = 0;
let playFrom = 0;

/* ------------------------------------------------------------------
   TEXTURA UV
   A malha continua controlando a transformação geométrica, mas NÃO
   controla mais a resolução visual do desenho. O padrão é rasterizado
   em uma textura de alta resolução por face e filtrado antes de ser
   aplicado por coordenadas UV. Isso elimina a aparência "dentada"
   causada pelas cores constantes de cada pequeno triângulo.
------------------------------------------------------------------ */

const PALETTE = new Map([
  ['43,182,115',[0,176,104]],     // verde
  ['46,117,212',[0,105,215]],     // azul
  ['229,57,53',[224,38,48]],      // vermelho
  ['248,248,244',[250,250,248]],  // branco
  ['242,231,196',[238,224,184]]   // faixa creme
]);

const DISPLAY_COLORS = [...PALETTE.values()];
const TEXTURE_SIZE = 1536;
const TEXTURE_PAD = 18;

function mappedColor(rgb){
  return PALETTE.get(`${rgb[0]},${rgb[1]},${rgb[2]}`) || rgb;
}

function dominantColor(colors,tri){
  const count=new Map();
  for(const idx of tri){
    const key=colors[idx].join(',');
    count.set(key,(count.get(key)||0)+1);
  }

  let bestKey=null,bestCount=-1;
  for(const [key,n] of count){
    if(n>bestCount){bestKey=key;bestCount=n;}
  }

  /* Se os três vértices tiverem categorias diferentes, preservamos
     primeiro as faixas claras, evitando que uma cor invada a costura. */
  if(bestCount===1){
    for(const preferred of ['248,248,244','242,231,196']){
      if(count.has(preferred)){bestKey=preferred;break;}
    }
  }
  return mappedColor(bestKey.split(',').map(Number));
}

function faceBounds(f){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of f.plan){
    minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);
    minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);
  }
  return {minX,maxX,minY,maxY,dx:maxX-minX,dy:maxY-minY};
}

function toTexturePixel(p,b,size=TEXTURE_SIZE,pad=TEXTURE_PAD){
  const inner=size-2*pad;
  const u=(p[0]-b.minX)/b.dx;
  const v=(p[1]-b.minY)/b.dy;
  return [pad+u*inner,size-pad-v*inner];
}

function nearestPaletteColor(r,g,b){
  let best=DISPLAY_COLORS[0],bestD=Infinity;
  for(const c of DISPLAY_COLORS){
    const dr=r-c[0],dg=g-c[1],db=b-c[2];
    const d=dr*dr+dg*dg+db*db;
    if(d<bestD){bestD=d;best=c;}
  }
  return best;
}

function buildFaceTexture(f,b){
  const size=TEXTURE_SIZE;
  const base=document.createElement('canvas');
  base.width=size;base.height=size;
  const ctx=base.getContext('2d',{willReadFrequently:true});
  ctx.clearRect(0,0,size,size);
  ctx.lineJoin='round';

  /* Cada triângulo é desenhado no canvas, não na superfície 3D.
     Um traço muito fino evita microfendas de antialias entre células. */
  for(const tri of f.triangles){
    const rgb=dominantColor(f.colors,tri);
    const a=toTexturePixel(f.plan[tri[0]],b);
    const c=toTexturePixel(f.plan[tri[1]],b);
    const d=toTexturePixel(f.plan[tri[2]],b);

    ctx.fillStyle=`rgb(${rgb[0]} ${rgb[1]} ${rgb[2]})`;
    ctx.strokeStyle=ctx.fillStyle;
    ctx.lineWidth=1.15;
    ctx.beginPath();
    ctx.moveTo(a[0],a[1]);
    ctx.lineTo(c[0],c[1]);
    ctx.lineTo(d[0],d[1]);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  /* Suavização estrutural:
     desfocamos apenas o suficiente para retirar a escadinha da malha e,
     em seguida, reconvertemos cada pixel à cor sólida mais próxima.
     Portanto as bordas ficam suaves sem produzir aparência "desgastada". */
  const softened=document.createElement('canvas');
  softened.width=size;softened.height=size;
  const sctx=softened.getContext('2d',{willReadFrequently:true});
  const blurRadius=Math.max(3,Math.round(size/(DATA.meta.meshResolution*2.2)));
  sctx.filter=`blur(${blurRadius}px)`;
  sctx.drawImage(base,0,0);
  sctx.filter='none';

  const original=ctx.getImageData(0,0,size,size);
  const image=sctx.getImageData(0,0,size,size);
  const od=original.data,id=image.data;

  for(let i=0;i<id.length;i+=4){
    const alpha=od[i+3];
    if(alpha===0){
      id[i+3]=0;
      continue;
    }

    /* Perto do contorno externo a transparência poderia contaminar o
       blur e criar um fino halo colorido. Nessas poucas linhas mantemos
       exatamente a cor original; o contorno da face já é retilíneo. */
    if(id[i+3]<250){
      id[i]=od[i];id[i+1]=od[i+1];id[i+2]=od[i+2];id[i+3]=alpha;
      continue;
    }

    const c=nearestPaletteColor(id[i],id[i+1],id[i+2]);
    id[i]=c[0];id[i+1]=c[1];id[i+2]=c[2];id[i+3]=alpha;
  }
  sctx.putImageData(image,0,0);

  const texture=new THREE.CanvasTexture(softened);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=THREE.ClampToEdgeWrapping;
  texture.wrapT=THREE.ClampToEdgeWrapping;
  texture.magFilter=THREE.LinearFilter;
  texture.minFilter=THREE.LinearMipmapLinearFilter;
  texture.generateMipmaps=true;
  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  texture.needsUpdate=true;
  return texture;
}

function putXYZ(out,k,p){
  out[k]=p[0];out[k+1]=p[1];out[k+2]=p[2];
}

/* ------------------------------------------------------------------
   DOBRA GEOMÉTRICA CORRETA DA PLANIFICAÇÃO

   Antes, cada vértice era interpolado em linha reta entre sua posição
   plana e sua posição no tetraedro. Isso fazia as faces encolherem e
   cisalharem durante a animação.

   Agora a planificação é primeiro colocada, por uma única semelhança,
   no plano da face central do tetraedro. Depois, cada uma das outras
   três faces gira rigidamente em torno da aresta que compartilha com a
   face central. O ângulo final é o ângulo de dobra do tetraedro regular
   (aprox. 109,47°), obtido diretamente dos dados.
------------------------------------------------------------------ */

const CENTRAL_FACE = DATA.faces.find(f=>f.name==='central') || DATA.faces[0];

function vec(a){return new THREE.Vector3(a[0],a[1],a[2]);}

function cornerIndex(face,vertexId){
  const target=vec(DATA.V3[vertexId]);
  let best=0,bestD=Infinity;
  for(let i=0;i<face.tetra.length;i++){
    const p=face.tetra[i];
    const dx=p[0]-target.x,dy=p[1]-target.y,dz=p[2]-target.z;
    const d=dx*dx+dy*dy+dz*dz;
    if(d<bestD){bestD=d;best=i;}
  }
  return best;
}

function corner(face,vertexId,field){
  return vec(face[field][cornerIndex(face,vertexId)]);
}

const cids=CENTRAL_FACE.idx3d;
const cp0=corner(CENTRAL_FACE,cids[0],'plan');
const cp1=corner(CENTRAL_FACE,cids[1],'plan');
const cp2=corner(CENTRAL_FACE,cids[2],'plan');
const cq0=vec(DATA.V3[cids[0]]);
const cq1=vec(DATA.V3[cids[1]]);
const cq2=vec(DATA.V3[cids[2]]);

const px=cp1.clone().sub(cp0).normalize();
const pz=cp1.clone().sub(cp0).cross(cp2.clone().sub(cp0)).normalize();
const py=pz.clone().cross(px).normalize();
const qx=cq1.clone().sub(cq0).normalize();
let qz=cq1.clone().sub(cq0).cross(cq2.clone().sub(cq0)).normalize();
let qy=qz.clone().cross(qx).normalize();

/* Orientamos a normal da face central para fora do tetraedro. */
const centralCentroid=cq0.clone().add(cq1).add(cq2).multiplyScalar(1/3);
if(qz.dot(centralCentroid)<0){
  qz.negate();
  qy=qz.clone().cross(qx).normalize();
}

/* Para a matriz de rotação precisamos manter a mesma orientação das
   bases. Se a normal foi invertida somente para uso visual, usamos a
   normal compatível com a base original para calcular a semelhança. */
const qzMap=cq1.clone().sub(cq0).cross(cq2.clone().sub(cq0)).normalize();
const qyMap=qzMap.clone().cross(qx).normalize();
const basisP=new THREE.Matrix4().makeBasis(px,py,pz);
const basisQ=new THREE.Matrix4().makeBasis(qx,qyMap,qzMap);
const flatRotationMatrix=new THREE.Matrix4().multiplyMatrices(
  basisQ,
  basisP.clone().invert()
);
const FLAT_ROTATION=new THREE.Quaternion().setFromRotationMatrix(flatRotationMatrix);
const FLAT_SCALE=cq0.distanceTo(cq1)/cp0.distanceTo(cp1);
const FLAT_TRANSLATION=cq0.clone().sub(
  cp0.clone().applyQuaternion(FLAT_ROTATION).multiplyScalar(FLAT_SCALE)
);
const FLAT_NORMAL=qz.clone();
const FLAT_UP=py.clone().applyQuaternion(FLAT_ROTATION).normalize();

function planToFlatWorld(p){
  return vec(p).applyQuaternion(FLAT_ROTATION).multiplyScalar(FLAT_SCALE).add(FLAT_TRANSLATION);
}

const foldMetaByName=new Map();
for(const f of DATA.faces){
  if(f===CENTRAL_FACE || f.name==='central'){
    foldMetaByName.set(f.name,{central:true,angle:0});
    continue;
  }

  const shared=f.idx3d.filter(id=>CENTRAL_FACE.idx3d.includes(id));
  const third=f.idx3d.find(id=>!shared.includes(id));
  if(shared.length!==2 || third===undefined){
    throw new Error(`Não foi possível determinar a dobradiça da face ${f.name}.`);
  }

  const hingeA=planToFlatWorld(corner(f,shared[0],'plan').toArray());
  const hingeB=planToFlatWorld(corner(f,shared[1],'plan').toArray());
  const axis=hingeB.clone().sub(hingeA).normalize();
  const thirdFlat=planToFlatWorld(corner(f,third,'plan').toArray());
  const thirdTarget=vec(DATA.V3[third]);

  const va=thirdFlat.clone().sub(hingeA);
  const vb=thirdTarget.clone().sub(hingeA);
  va.addScaledVector(axis,-va.dot(axis));
  vb.addScaledVector(axis,-vb.dot(axis));
  va.normalize();
  vb.normalize();

  const angle=Math.atan2(
    axis.dot(va.clone().cross(vb)),
    THREE.MathUtils.clamp(va.dot(vb),-1,1)
  );

  foldMetaByName.set(f.name,{central:false,hingeA,axis,angle});
}

function foldArrayInto(attr,flat,meta,t,normalOffset=0){
  const out=attr.array;
  if(meta.central || Math.abs(meta.angle)<1e-12){
    for(let i=0;i<out.length;i+=3){
      out[i]=flat[i]+FLAT_NORMAL.x*normalOffset;
      out[i+1]=flat[i+1]+FLAT_NORMAL.y*normalOffset;
      out[i+2]=flat[i+2]+FLAT_NORMAL.z*normalOffset;
    }
    attr.needsUpdate=true;
    return;
  }

  const a=meta.axis,h=meta.hingeA;
  const ang=meta.angle*t;
  const c=Math.cos(ang),sn=Math.sin(ang),omc=1-c;

  /* A normal gira junto com a face; útil para afastar ligeiramente as
     linhas de costura e evitar z-fighting. */
  const nx=FLAT_NORMAL.x,ny=FLAT_NORMAL.y,nz=FLAT_NORMAL.z;
  const ndot=a.x*nx+a.y*ny+a.z*nz;
  const ncx=a.y*nz-a.z*ny;
  const ncy=a.z*nx-a.x*nz;
  const ncz=a.x*ny-a.y*nx;
  const rnx=nx*c+ncx*sn+a.x*ndot*omc;
  const rny=ny*c+ncy*sn+a.y*ndot*omc;
  const rnz=nz*c+ncz*sn+a.z*ndot*omc;

  for(let i=0;i<out.length;i+=3){
    const x=flat[i]-h.x,y=flat[i+1]-h.y,z=flat[i+2]-h.z;
    const dot=a.x*x+a.y*y+a.z*z;
    const cx=a.y*z-a.z*y;
    const cy=a.z*x-a.x*z;
    const cz=a.x*y-a.y*x;

    out[i]=h.x+x*c+cx*sn+a.x*dot*omc+rnx*normalOffset;
    out[i+1]=h.y+y*c+cy*sn+a.y*dot*omc+rny*normalOffset;
    out[i+2]=h.z+z*c+cz*sn+a.z*dot*omc+rnz*normalOffset;
  }
  attr.needsUpdate=true;
}

function buildFaceGeometry(f){
  const nTri=f.triangles.length;
  const flatPlan=new Float32Array(nTri*9);
  const tetra=new Float32Array(nTri*9);
  const sphere=new Float32Array(nTri*9);
  const uv=new Float32Array(nTri*6);
  const bounds=faceBounds(f);
  const pad=TEXTURE_PAD/TEXTURE_SIZE;
  const inner=1-2*pad;

  let k=0,kuv=0;
  for(const tri of f.triangles){
    for(const idx of tri){
      const p=f.plan[idx];
      const fp=planToFlatWorld(p);
      flatPlan[k]=fp.x;flatPlan[k+1]=fp.y;flatPlan[k+2]=fp.z;
      putXYZ(tetra,k,f.tetra[idx]);
      putXYZ(sphere,k,f.sphere[idx]);

      uv[kuv++]=pad+((p[0]-bounds.minX)/bounds.dx)*inner;
      uv[kuv++]=pad+((p[1]-bounds.minY)/bounds.dy)*inner;
      k+=3;
    }
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(flatPlan.slice(),3));
  geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  geometry.computeVertexNormals();
  geometry.userData={
    flatPlan,
    tetra,
    sphere,
    foldMeta:foldMetaByName.get(f.name)
  };

  const texture=buildFaceTexture(f,bounds);
  const material=new THREE.MeshLambertMaterial({
    map:texture,
    color:0xffffff,
    side:THREE.DoubleSide
  });

  const mesh=new THREE.Mesh(geometry,material);
  root.add(mesh);
  faceMeshes.push(mesh);
}

for(const f of DATA.faces) buildFaceGeometry(f);

/* Centro e escala visual da planificação já colocada no plano da face
   central do tetraedro. A câmera inicial olha perpendicularmente para
   esse plano, portanto a planificação continua aparecendo como 2D. */
const FLAT_NET_BOX=new THREE.Box3();
for(const f of DATA.faces){
  for(const p of f.plan) FLAT_NET_BOX.expandByPoint(planToFlatWorld(p));
}
const FLAT_NET_CENTER=FLAT_NET_BOX.getCenter(new THREE.Vector3());
const FLAT_NET_SIZE=FLAT_NET_BOX.getSize(new THREE.Vector3());
const FLAT_VIEW_DISTANCE=Math.max(4.8,FLAT_NET_SIZE.length()*1.52);

/* ------------------------------------------------------------------
   COSTURAS
   Não usamos mais arestas do tetraedro nem a estrutura dual reta.
   DATA.whiteSeams foi calculado sobre a própria malha, restringindo
   o caminho às regiões branca/creme. Assim a linha acompanha a faixa
   clara em vez de atravessar as regiões coloridas.
------------------------------------------------------------------ */

function flatSeamArray(arr){
  const out=new Float32Array(arr.length*3);
  let k=0;
  for(const p of arr){
    const q=planToFlatWorld(p);
    out[k++]=q.x;out[k++]=q.y;out[k++]=q.z;
  }
  return out;
}

function raisedSeamArray(arr,state){
  const out=new Float32Array(arr.length*3);
  let k=0;
  const scale=state==='sphere'?1.006:1.004;
  for(const p of arr){
    out[k++]=p[0]*scale;out[k++]=p[1]*scale;out[k++]=p[2]*scale;
  }
  return out;
}

const seamSource=DATA.whiteSeams || [];
if(!seamSource.length){
  console.warn('whiteSeams não encontrado; as costuras foram ocultadas para não atravessar as regiões coloridas.');
}

for(const s of seamSource){
  const geometry=new THREE.BufferGeometry();
  const flatPlan=flatSeamArray(s.plan);
  const tetra=raisedSeamArray(s.tetra,'tetra');
  const sphere=raisedSeamArray(s.sphere,'sphere');
  const foldMeta=foldMetaByName.get(s.face) || foldMetaByName.get('central');

  geometry.setAttribute('position',new THREE.BufferAttribute(flatPlan.slice(),3));
  geometry.userData={flatPlan,tetra,sphere,foldMeta};

  const material=new THREE.LineDashedMaterial({
    color:0x6d737a,
    dashSize:0.027,
    gapSize:0.018,
    transparent:true,
    opacity:0.78,
    depthTest:true
  });

  const line=new THREE.Line(geometry,material);
  line.computeLineDistances();
  line.renderOrder=7;
  root.add(line);
  seamLines.push(line);
}

/* ------------------------------------------------------------------
   GIZMO DE ORIENTAÇÃO
   Não é um segundo controle de rotação. Ele serve somente para saltar,
   com animação suave, para as vistas ±X, ±Y e ±Z.
------------------------------------------------------------------ */

const gizmoScene=new THREE.Scene();
const gizmoCamera=new THREE.PerspectiveCamera(34,1,0.1,10);
const gizmoRenderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
gizmoRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
gizmoRenderer.outputColorSpace=THREE.SRGBColorSpace;
gizmoRenderer.setClearColor(0x000000,0);
orientationHost.appendChild(gizmoRenderer.domElement);

const axes=new THREE.AxesHelper(0.76);
gizmoScene.add(axes);

const origin=new THREE.Mesh(
  new THREE.SphereGeometry(0.045,16,12),
  new THREE.MeshBasicMaterial({color:0xb9bec5})
);
gizmoScene.add(origin);

function makeLabel(text,color){
  const canvas=document.createElement('canvas');
  canvas.width=128;canvas.height=128;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,128,128);
  ctx.font='700 72px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle=color;
  ctx.fillText(text,64,64);
  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({
    map:texture,
    transparent:true,
    depthTest:false,
    toneMapped:false
  }));
  sprite.scale.set(0.28,0.28,0.28);
  return sprite;
}

const lx=makeLabel('X','#ff5555');lx.position.set(1.08,0,0);gizmoScene.add(lx);
const ly=makeLabel('Y','#52d273');ly.position.set(0,1.08,0);gizmoScene.add(ly);
const lz=makeLabel('Z','#55a7ff');lz.position.set(0,0,1.08);gizmoScene.add(lz);

const gizmoHits=[];
function addViewPoint(dir,color,positive=true){
  const visible=new THREE.Mesh(
    new THREE.SphereGeometry(positive?0.085:0.060,18,14),
    new THREE.MeshBasicMaterial({
      color,
      transparent:!positive,
      opacity:positive?1:0.58,
      depthTest:false
    })
  );
  visible.position.copy(dir).multiplyScalar(0.82);
  gizmoScene.add(visible);

  const hit=new THREE.Mesh(
    new THREE.SphereGeometry(0.18,12,8),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthTest:false})
  );
  hit.position.copy(dir).multiplyScalar(0.82);
  hit.userData.viewDir=dir.clone();
  hit.userData.viewUp=Math.abs(dir.z)>.8
    ? new THREE.Vector3(0,1,0)
    : new THREE.Vector3(0,0,1);
  gizmoScene.add(hit);
  gizmoHits.push(hit);
}

addViewPoint(new THREE.Vector3( 1,0,0),0xff5555,true);
addViewPoint(new THREE.Vector3(-1,0,0),0xff5555,false);
addViewPoint(new THREE.Vector3(0, 1,0),0x52d273,true);
addViewPoint(new THREE.Vector3(0,-1,0),0x52d273,false);
addViewPoint(new THREE.Vector3(0,0, 1),0x55a7ff,true);
addViewPoint(new THREE.Vector3(0,0,-1),0x55a7ff,false);

const gizmoRaycaster=new THREE.Raycaster();
const gizmoPointer=new THREE.Vector2();
let viewTween=null;

function startAxisView(dir,up){
  const center=controls.target.clone();
  const offset=camera.position.clone().sub(center);
  const distance=Math.max(controls.minDistance,Math.min(controls.maxDistance,offset.length()));
  const startDir=offset.lengthSq()>1e-10
    ? offset.normalize()
    : new THREE.Vector3(1,1,1).normalize();

  const endDir=dir.clone().normalize();
  const rotation=new THREE.Quaternion().setFromUnitVectors(startDir,endDir);

  viewTween={
    start:performance.now(),
    duration:520,
    center,
    distance,
    startDir,
    rotation,
    startUp:camera.up.clone().normalize(),
    endUp:up.clone().normalize()
  };
  controls.enabled=false;
}

function updateViewTween(now){
  if(!viewTween)return;

  const q=viewTween;
  const raw=Math.min(1,(now-q.start)/q.duration);
  const t=raw*raw*(3-2*raw);

  const partial=new THREE.Quaternion().identity().slerp(q.rotation,t);
  const dir=q.startDir.clone().applyQuaternion(partial).normalize();

  camera.position.copy(q.center).addScaledVector(dir,q.distance);
  camera.up.copy(q.startUp).lerp(q.endUp,t).normalize();
  camera.lookAt(q.center);

  if(raw>=1){
    camera.up.copy(q.endUp);
    camera.lookAt(q.center);
    controls.enabled=true;
    controls.update();
    viewTween=null;
  }
}

gizmoRenderer.domElement.addEventListener('pointerdown',e=>{
  e.preventDefault();
  e.stopPropagation();

  const r=gizmoRenderer.domElement.getBoundingClientRect();
  gizmoPointer.x=((e.clientX-r.left)/r.width)*2-1;
  gizmoPointer.y=-((e.clientY-r.top)/r.height)*2+1;
  gizmoRaycaster.setFromCamera(gizmoPointer,gizmoCamera);

  const hit=gizmoRaycaster.intersectObjects(gizmoHits,false)[0];
  if(hit){
    startAxisView(hit.object.userData.viewDir,hit.object.userData.viewUp);
  }
});

function updateGizmo(){
  const d=camera.position.clone().sub(controls.target).normalize();
  gizmoCamera.position.copy(d.multiplyScalar(2.7));
  gizmoCamera.up.copy(camera.up);
  gizmoCamera.lookAt(0,0,0);
  gizmoRenderer.render(gizmoScene,gizmoCamera);
}

/* ------------------------------------------------------------------ */

function smooth(t){return t*t*(3-2*t);}

function mixPositions(attr,a,b,t){
  const out=attr.array,u=1-t;
  for(let i=0;i<out.length;i++) out[i]=u*a[i]+t*b[i];
  attr.needsUpdate=true;
}

function labelFor(v){
  if(v<2)return 'Planificação';
  if(v<48)return 'Planificação → tetraedro';
  if(v<52)return 'Tetraedro';
  if(v<98)return 'Tetraedro → esfera';
  return 'Esfera';
}

function updateMorph(raw){
  const v=Number(raw),s=v/100;
  percent.textContent=`${Math.round(v)}%`;
  stage.textContent=labelFor(v);

  if(s<=.5){
    /* Dobra real: cada face lateral permanece rígida e gira somente
       em torno de sua aresta comum com a face central. */
    const ft=smooth(s*2);

    for(const mesh of faceMeshes){
      const d=mesh.geometry.userData;
      const pos=mesh.geometry.attributes.position;
      foldArrayInto(pos,d.flatPlan,d.foldMeta,ft,0);
      mesh.geometry.computeVertexNormals();
      mesh.geometry.attributes.normal.needsUpdate=true;
    }

    for(const line of seamLines){
      const d=line.geometry.userData;
      foldArrayInto(line.geometry.attributes.position,d.flatPlan,d.foldMeta,ft,0.0045);
      line.computeLineDistances();
    }
  }else{
    /* A segunda etapa continua sendo uma transformação geométrica do
       tetraedro para a esfera. */
    const st=smooth((s-.5)*2);

    for(const mesh of faceMeshes){
      const d=mesh.geometry.userData;
      const pos=mesh.geometry.attributes.position;
      mixPositions(pos,d.tetra,d.sphere,st);
      mesh.geometry.computeVertexNormals();
      mesh.geometry.attributes.normal.needsUpdate=true;
    }

    for(const line of seamLines){
      const d=line.geometry.userData;
      mixPositions(line.geometry.attributes.position,d.tetra,d.sphere,st);
      line.computeLineDistances();
    }
  }
}

function setViewFor(value){
  const v=Number(value);
  viewTween=null;
  controls.enabled=true;

  if(v<20){
    /* Vista perpendicular à planificação. */
    controls.target.copy(FLAT_NET_CENTER);
    camera.up.copy(FLAT_UP);
    camera.position.copy(FLAT_NET_CENTER).addScaledVector(FLAT_NORMAL,FLAT_VIEW_DISTANCE);
  }else{
    /* Vista espacial estável para tetraedro e esfera. */
    controls.target.set(0,0,0);
    camera.up.set(0,0,1);
    camera.position.copy(
      new THREE.Vector3(1.45,1.35,1.10).normalize().multiplyScalar(3.15)
    );
  }

  camera.lookAt(controls.target);
  controls.update();
}

morph.addEventListener('input',()=>{
  playing=false;
  playButton.textContent='▶ Animar';
  updateMorph(morph.value);
});

document.querySelectorAll('[data-stop]').forEach(button=>{
  button.addEventListener('click',()=>{
    playing=false;
    playButton.textContent='▶ Animar';
    morph.value=button.dataset.stop;
    updateMorph(morph.value);
    setViewFor(morph.value);
  });
});

seamsButton.addEventListener('click',()=>{
  showSeams=!showSeams;
  seamLines.forEach(line=>line.visible=showSeams);
  seamsButton.textContent=`Costuras: ${showSeams?'sim':'não'}`;
  seamsButton.setAttribute('aria-pressed',String(showSeams));
});

resetButton.addEventListener('click',()=>setViewFor(morph.value));

playButton.addEventListener('click',()=>{
  playing=!playing;
  if(playing){
    playFrom=Number(morph.value);
    if(playFrom>=100)playFrom=0;
    playStart=performance.now();
    playButton.textContent='⏸ Pausar';
  }else{
    playButton.textContent='▶ Animar';
  }
});

function resize(){
  const r=host.getBoundingClientRect();
  const w=Math.max(1,r.width),h=Math.max(1,r.height);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();

  const gr=orientationHost.getBoundingClientRect();
  gizmoRenderer.setSize(Math.max(1,gr.width),Math.max(1,gr.height),false);
  gizmoCamera.aspect=1;
  gizmoCamera.updateProjectionMatrix();
}

new ResizeObserver(resize).observe(host);
new ResizeObserver(resize).observe(orientationHost);

resize();
setViewFor(0);
updateMorph(0);

function animate(now){
  requestAnimationFrame(animate);

  if(playing){
    const duration=9000;
    const elapsed=now-playStart;
    let v=playFrom+(100-playFrom)*(elapsed/duration);

    if(v>=100){
      v=100;
      playing=false;
      playButton.textContent='▶ Animar';
    }

    morph.value=String(v);
    updateMorph(v);
  }

  updateViewTween(now);
  if(controls.enabled) controls.update();
  renderer.render(scene,camera);
  updateGizmo();
}

requestAnimationFrame(animate);
</script>
</body>
