<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trionda — LVM</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f5f6f7;--panel:#fff;--text:#202124;--muted:#666b73;
      --border:#d7d9dd;--accent:#315fd4
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#111315;--panel:#1d2023;--text:#f3f4f5;--muted:#b3b8bf;--border:#3a3e44;--accent:#88a8ff}
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
    .title{font-weight:750}
    .back{color:var(--text);text-decoration:none;font-size:.92rem}
    .viewer{position:relative;flex:1;min-height:520px}
    .canvas{position:absolute;inset:0}
    .canvas canvas{display:block;width:100%;height:100%}
    .controls{
      position:absolute;left:14px;right:14px;bottom:14px;
      display:grid;grid-template-columns:minmax(180px,1fr) auto;
      gap:12px;align-items:end;padding:12px;border:1px solid var(--border);
      border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);
      backdrop-filter:blur(7px)
    }
    .range-wrap{min-width:0}
    .labels{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem}
    .stage{font-weight:700;margin-bottom:5px}
    .range{width:100%}
    .buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    button{font:inherit;min-height:42px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--panel);color:var(--text);cursor:pointer}
    .primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .hint{
      position:absolute;left:14px;top:14px;max-width:min(520px,calc(100% - 160px));
      padding:9px 11px;border-radius:10px;
      background:color-mix(in srgb,var(--panel) 90%,transparent);
      border:1px solid var(--border);color:var(--muted);font-size:.84rem;pointer-events:none
    }
    .orientation{
      position:absolute;right:14px;top:14px;width:116px;height:116px;
      border:1px solid var(--border);border-radius:14px;
      background:color-mix(in srgb,var(--panel) 84%,transparent);
      backdrop-filter:blur(6px);overflow:hidden;pointer-events:none
    }
    .orientation::after{
      content:"orientação";position:absolute;left:0;right:0;bottom:4px;
      text-align:center;font-size:.68rem;color:var(--muted);letter-spacing:.02em
    }
    .orientation canvas{display:block;width:100%;height:100%}
    @media(max-width:700px){
      .viewer{min-height:600px}
      .controls{grid-template-columns:1fr}
      .buttons{justify-content:flex-start}
      .top{align-items:flex-start;flex-direction:column}
      .orientation{width:92px;height:92px}
      .hint{max-width:calc(100% - 124px)}
      .orientation::after{font-size:.6rem}
    }
  </style>

  <script type="importmap">
  {
    "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <!-- ?v=3 evita que o navegador use uma cópia antiga em cache. -->
  <script src="trionda-data.js?v=3"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="title">Trionda — exploração 3D</div>
      <div style="font-size:.86rem;color:var(--muted)">Planificação → tetraedro → esfera</div>
    </div>
    <a class="back" href="../">← Interativos do LVM</a>
  </header>

  <main class="viewer">
    <div id="canvas-host" class="canvas"></div>

    <div class="hint">
      Botão esquerdo: girar · roda/pinça: zoom · botão direito: deslocar
    </div>

    <div id="orientation" class="orientation" aria-label="Indicador dos eixos X, Y e Z"></div>

    <section class="controls" aria-label="Controles da visualização">
      <div class="range-wrap">
        <div id="stage" class="stage">Planificação</div>
        <input id="morph" class="range" type="range" min="0" max="100" step="1" value="0"
               aria-label="Transformação entre planificação, tetraedro e esfera">
        <div class="labels">
          <span>Planificação</span><span id="percent">0%</span><span>Esfera</span>
        </div>
      </div>

      <div class="buttons">
        <button type="button" data-stop="0">Plano</button>
        <button type="button" data-stop="50">Tetraedro</button>
        <button type="button" data-stop="100">Esfera</button>
        <button id="seams" type="button" aria-pressed="true">Costuras: sim</button>
        <button id="reset" type="button">Restaurar vista</button>
        <button id="play" type="button" class="primary">▶ Animar</button>
      </div>
    </section>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = window.TRIONDA_DATA;
if (!DATA) throw new Error('trionda-data.js não foi carregado.');

const host = document.getElementById('canvas-host');
const morph = document.getElementById('morph');
const percent = document.getElementById('percent');
const stage = document.getElementById('stage');
const seamsButton = document.getElementById('seams');
const resetButton = document.getElementById('reset');
const playButton = document.getElementById('play');
const orientationHost = document.getElementById('orientation');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(36,1,0.01,100);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000,0);
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.75;
controls.minDistance = 1.25;
controls.maxDistance = 7;
controls.screenSpacePanning = true;

/* Luz muito suave. A cor é mantida quase integral e a luz serve só
   para dar leitura espacial à superfície. */
scene.add(new THREE.AmbientLight(0xffffff,0.92));
const key = new THREE.DirectionalLight(0xffffff,0.28);
key.position.set(3,-2,4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff,0.10);
fill.position.set(-3,2,-1);
scene.add(fill);

const root = new THREE.Group();
scene.add(root);

const faceMeshes = [];
const seamLines = [];
let showSeams = true;
let playing = false;
let playStart = 0;
let playFrom = 0;

/* ------------------------------------------------------------------
   CORES
   As cores do arquivo são categorias. Não interpolamos uma categoria
   na outra: cada pequeno triângulo recebe uma única cor. Isso evita
   o aspecto "desgastado" nas fronteiras.
------------------------------------------------------------------ */

const PALETTE = new Map([
  ['43,182,115',[0,176,104]],     // verde
  ['46,117,212',[0,105,215]],     // azul
  ['229,57,53',[224,38,48]],      // vermelho
  ['248,248,244',[250,250,248]],  // branco
  ['242,231,196',[238,224,184]]   // faixa creme
]);

function srgbChannelToLinear(v){
  const x=v/255;
  return x<=0.04045 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4);
}

function mappedColor(rgb){
  return PALETTE.get(`${rgb[0]},${rgb[1]},${rgb[2]}`) || rgb;
}

function dominantColor(colors,tri){
  const count=new Map();
  for(const idx of tri){
    const key=colors[idx].join(',');
    count.set(key,(count.get(key)||0)+1);
  }
  let bestKey=null,bestCount=-1;
  for(const [key,n] of count){
    if(n>bestCount){bestKey=key;bestCount=n;}
  }
  /* Empates são raros; se houver, preferimos a cor clara para que
     a faixa branca não seja invadida pela cor vizinha. */
  if(bestCount===1){
    for(const preferred of ['248,248,244','242,231,196']){
      if(count.has(preferred)){bestKey=preferred;break;}
    }
  }
  return mappedColor(bestKey.split(',').map(Number));
}

function putXYZ(out,k,p){
  out[k]=p[0];out[k+1]=p[1];out[k+2]=p[2];
}

function buildFaceGeometry(f){
  const nTri=f.triangles.length;
  const plan=new Float32Array(nTri*9);
  const tetra=new Float32Array(nTri*9);
  const sphere=new Float32Array(nTri*9);
  const colors=new Float32Array(nTri*9);

  let k=0;
  for(const tri of f.triangles){
    const rgb=dominantColor(f.colors,tri);
    const lr=srgbChannelToLinear(rgb[0]);
    const lg=srgbChannelToLinear(rgb[1]);
    const lb=srgbChannelToLinear(rgb[2]);

    for(const idx of tri){
      putXYZ(plan,k,f.plan[idx]);
      putXYZ(tetra,k,f.tetra[idx]);
      putXYZ(sphere,k,f.sphere[idx]);

      colors[k]=lr;colors[k+1]=lg;colors[k+2]=lb;
      k+=3;
    }
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(plan.slice(),3));
  geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
  geometry.computeVertexNormals();
  geometry.userData={plan,tetra,sphere};

  const material=new THREE.MeshLambertMaterial({
    vertexColors:true,
    side:THREE.DoubleSide
  });

  const mesh=new THREE.Mesh(geometry,material);
  root.add(mesh);
  faceMeshes.push(mesh);
}

for(const f of DATA.faces) buildFaceGeometry(f);

/* ------------------------------------------------------------------
   COSTURAS
   Não usamos mais arestas do tetraedro nem a estrutura dual reta.
   DATA.whiteSeams foi calculado sobre a própria malha, restringindo
   o caminho às regiões branca/creme. Assim a linha acompanha a faixa
   clara em vez de atravessar as regiões coloridas.
------------------------------------------------------------------ */

function flattenSeam(arr,state){
  const out=new Float32Array(arr.length*3);
  let k=0;
  for(const p0 of arr){
    let x=p0[0],y=p0[1],z=p0[2];

    if(state==='plan'){
      z+=0.004;
    }else{
      const scale=state==='sphere'?1.006:1.004;
      x*=scale;y*=scale;z*=scale;
    }

    out[k++]=x;out[k++]=y;out[k++]=z;
  }
  return out;
}

const seamSource=DATA.whiteSeams || [];
if(!seamSource.length){
  console.warn('whiteSeams não encontrado; as costuras foram ocultadas para não atravessar as regiões coloridas.');
}

for(const s of seamSource){
  const geometry=new THREE.BufferGeometry();
  const plan=flattenSeam(s.plan,'plan');
  const tetra=flattenSeam(s.tetra,'tetra');
  const sphere=flattenSeam(s.sphere,'sphere');

  geometry.setAttribute('position',new THREE.BufferAttribute(plan.slice(),3));
  geometry.userData={plan,tetra,sphere};

  const material=new THREE.LineDashedMaterial({
    color:0x6d737a,
    dashSize:0.027,
    gapSize:0.018,
    transparent:true,
    opacity:0.78,
    depthTest:true
  });

  const line=new THREE.Line(geometry,material);
  line.computeLineDistances();
  line.renderOrder=7;
  root.add(line);
  seamLines.push(line);
}

/* ------------------------------------------------------------------
   GIZMO DE ORIENTAÇÃO, semelhante ao princípio usado no Blender.
------------------------------------------------------------------ */

const gizmoScene=new THREE.Scene();
const gizmoCamera=new THREE.PerspectiveCamera(34,1,0.1,10);
const gizmoRenderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
gizmoRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
gizmoRenderer.outputColorSpace=THREE.SRGBColorSpace;
gizmoRenderer.setClearColor(0x000000,0);
orientationHost.appendChild(gizmoRenderer.domElement);

const axes=new THREE.AxesHelper(0.78);
gizmoScene.add(axes);

const origin=new THREE.Mesh(
  new THREE.SphereGeometry(0.045,16,12),
  new THREE.MeshBasicMaterial({color:0xb9bec5})
);
gizmoScene.add(origin);

function makeLabel(text,color){
  const canvas=document.createElement('canvas');
  canvas.width=128;canvas.height=128;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,128,128);
  ctx.font='700 72px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle=color;
  ctx.fillText(text,64,64);
  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({
    map:texture,
    transparent:true,
    depthTest:false,
    toneMapped:false
  }));
  sprite.scale.set(0.28,0.28,0.28);
  return sprite;
}

const lx=makeLabel('X','#ff5555');lx.position.set(0.98,0,0);gizmoScene.add(lx);
const ly=makeLabel('Y','#52d273');ly.position.set(0,0.98,0);gizmoScene.add(ly);
const lz=makeLabel('Z','#55a7ff');lz.position.set(0,0,0.98);gizmoScene.add(lz);

function updateGizmo(){
  const d=camera.position.clone().sub(controls.target).normalize();
  gizmoCamera.position.copy(d.multiplyScalar(2.7));
  gizmoCamera.up.copy(camera.up);
  gizmoCamera.lookAt(0,0,0);
  gizmoRenderer.render(gizmoScene,gizmoCamera);
}

/* ------------------------------------------------------------------ */

function smooth(t){return t*t*(3-2*t);}

function mixPositions(attr,a,b,t){
  const out=attr.array,u=1-t;
  for(let i=0;i<out.length;i++) out[i]=u*a[i]+t*b[i];
  attr.needsUpdate=true;
}

function labelFor(v){
  if(v<2)return 'Planificação';
  if(v<48)return 'Planificação → tetraedro';
  if(v<52)return 'Tetraedro';
  if(v<98)return 'Tetraedro → esfera';
  return 'Esfera';
}

function updateMorph(raw){
  const v=Number(raw),s=v/100;
  percent.textContent=`${Math.round(v)}%`;
  stage.textContent=labelFor(v);

  for(const mesh of faceMeshes){
    const d=mesh.geometry.userData;
    const pos=mesh.geometry.attributes.position;

    if(s<=.5) mixPositions(pos,d.plan,d.tetra,smooth(s*2));
    else mixPositions(pos,d.tetra,d.sphere,smooth((s-.5)*2));

    mesh.geometry.computeVertexNormals();
    mesh.geometry.attributes.normal.needsUpdate=true;
  }

  for(const line of seamLines){
    const d=line.geometry.userData;
    const pos=line.geometry.attributes.position;

    if(s<=.5) mixPositions(pos,d.plan,d.tetra,smooth(s*2));
    else mixPositions(pos,d.tetra,d.sphere,smooth((s-.5)*2));

    line.computeLineDistances();
  }
}

function setViewFor(value){
  const v=Number(value);
  const p=v<20
    ? new THREE.Vector3(0,0,3.5)
    : new THREE.Vector3(1.45,1.35,1.10).normalize().multiplyScalar(3.15);

  camera.position.copy(p);
  camera.up.set(0,0,1);
  controls.target.set(0,0,0);
  controls.update();
}

morph.addEventListener('input',()=>{
  playing=false;
  playButton.textContent='▶ Animar';
  updateMorph(morph.value);
});

document.querySelectorAll('[data-stop]').forEach(button=>{
  button.addEventListener('click',()=>{
    playing=false;
    playButton.textContent='▶ Animar';
    morph.value=button.dataset.stop;
    updateMorph(morph.value);
    setViewFor(morph.value);
  });
});

seamsButton.addEventListener('click',()=>{
  showSeams=!showSeams;
  seamLines.forEach(line=>line.visible=showSeams);
  seamsButton.textContent=`Costuras: ${showSeams?'sim':'não'}`;
  seamsButton.setAttribute('aria-pressed',String(showSeams));
});

resetButton.addEventListener('click',()=>setViewFor(morph.value));

playButton.addEventListener('click',()=>{
  playing=!playing;
  if(playing){
    playFrom=Number(morph.value);
    if(playFrom>=100)playFrom=0;
    playStart=performance.now();
    playButton.textContent='⏸ Pausar';
  }else{
    playButton.textContent='▶ Animar';
  }
});

function resize(){
  const r=host.getBoundingClientRect();
  const w=Math.max(1,r.width),h=Math.max(1,r.height);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();

  const gr=orientationHost.getBoundingClientRect();
  gizmoRenderer.setSize(Math.max(1,gr.width),Math.max(1,gr.height),false);
  gizmoCamera.aspect=1;
  gizmoCamera.updateProjectionMatrix();
}

new ResizeObserver(resize).observe(host);
new ResizeObserver(resize).observe(orientationHost);

resize();
setViewFor(0);
updateMorph(0);

function animate(now){
  requestAnimationFrame(animate);

  if(playing){
    const duration=9000;
    const elapsed=now-playStart;
    let v=playFrom+(100-playFrom)*(elapsed/duration);

    if(v>=100){
      v=100;
      playing=false;
      playButton.textContent='▶ Animar';
    }

    morph.value=String(v);
    updateMorph(v);
  }

  controls.update();
  renderer.render(scene,camera);
  updateGizmo();
}

requestAnimationFrame(animate);
</script>
</body>
</html>
