<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trionda — LVM</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f6f7;--panel:#fff;--text:#202124;--muted:#666b73;--border:#d7d9dd;--accent:#315fd4}
    @media(prefers-color-scheme:dark){:root{--bg:#111315;--panel:#1d2023;--text:#f3f4f5;--muted:#b3b8bf;--border:#3a3e44;--accent:#88a8ff}}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
    .title{font-weight:750}.back{color:var(--text);text-decoration:none;font-size:.92rem}.viewer{position:relative;flex:1;min-height:520px}.canvas{position:absolute;inset:0}.canvas canvas{display:block;width:100%;height:100%}
    .controls{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:12px;align-items:end;padding:12px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(7px)}
    .range-wrap{min-width:0}.labels{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem}.stage{font-weight:700;margin-bottom:5px}.range{width:100%}
    .buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}button{font:inherit;min-height:42px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--panel);color:var(--text);cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .hint{position:absolute;left:14px;top:14px;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--border);color:var(--muted);font-size:.84rem;pointer-events:none}
    @media(max-width:700px){.viewer{min-height:600px}.controls{grid-template-columns:1fr}.buttons{justify-content:flex-start}.top{align-items:flex-start;flex-direction:column}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <script src="trionda-data.js"></script>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="title">Trionda — exploração 3D</div><div style="font-size:.86rem;color:var(--muted)">Planificação → tetraedro → esfera</div></div><a class="back" href="../">← Interativos do LVM</a></header>
  <main class="viewer">
    <div id="canvas-host" class="canvas"></div>
    <div class="hint">Arraste para girar · roda/pinça para zoom</div>
    <section class="controls" aria-label="Controles da visualização">
      <div class="range-wrap">
        <div id="stage" class="stage">Planificação</div>
        <input id="morph" class="range" type="range" min="0" max="100" step="1" value="0" aria-label="Transformação entre planificação, tetraedro e esfera">
        <div class="labels"><span>Planificação</span><span id="percent">0%</span><span>Esfera</span></div>
      </div>
      <div class="buttons">
        <button type="button" data-stop="0">Plano</button>
        <button type="button" data-stop="50">Tetraedro</button>
        <button type="button" data-stop="100">Esfera</button>
        <button id="seams" type="button" aria-pressed="true">Costuras: sim</button>
        <button id="reset" type="button">Restaurar vista</button>
        <button id="play" type="button" class="primary">▶ Animar</button>
      </div>
    </section>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = window.TRIONDA_DATA;
if (!DATA) throw new Error('trionda-data.js não foi carregado.');

const host = document.getElementById('canvas-host');
const morph = document.getElementById('morph');
const percent = document.getElementById('percent');
const stage = document.getElementById('stage');
const seamsButton = document.getElementById('seams');
const resetButton = document.getElementById('reset');
const playButton = document.getElementById('play');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 100);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.25;
controls.maxDistance = 7;

scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3,-2,4);
scene.add(key);

const root = new THREE.Group();
scene.add(root);
const faceMeshes = [];
const outlineLines = [];
let showSeams = true;
let playing = false;
let playStart = 0;
let playFrom = 0;

function flatten3(arr){const out=new Float32Array(arr.length*3);let k=0;for(const p of arr){out[k++]=p[0];out[k++]=p[1];out[k++]=p[2];}return out;}
function flattenColors(arr){const out=new Float32Array(arr.length*3);let k=0;for(const c of arr){out[k++]=c[0]/255;out[k++]=c[1]/255;out[k++]=c[2]/255;}return out;}
function flattenIndex(tris){const out=new Uint32Array(tris.length*3);let k=0;for(const t of tris){out[k++]=t[0];out[k++]=t[1];out[k++]=t[2];}return out;}
function smooth(t){return t*t*(3-2*t);}
function mixPositions(attr,a,b,t){const out=attr.array,u=1-t;for(let i=0;i<out.length;i++)out[i]=u*a[i]+t*b[i];attr.needsUpdate=true;}

for(const f of DATA.faces){
  const geometry=new THREE.BufferGeometry();
  const plan=flatten3(f.plan),tetra=flatten3(f.tetra),sphere=flatten3(f.sphere);
  geometry.setAttribute('position',new THREE.BufferAttribute(plan.slice(),3));
  geometry.setAttribute('color',new THREE.BufferAttribute(flattenColors(f.colors),3));
  geometry.setIndex(new THREE.BufferAttribute(flattenIndex(f.triangles),1));
  geometry.computeVertexNormals();
  geometry.userData={plan,tetra,sphere};
  const material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.88,metalness:0,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geometry,material);
  root.add(mesh);faceMeshes.push(mesh);
}

for(const o of DATA.outlines){
  const geometry=new THREE.BufferGeometry();
  const plan=flatten3(o.plan),tetra=flatten3(o.tetra),sphere=flatten3(o.sphere);
  geometry.setAttribute('position',new THREE.BufferAttribute(plan.slice(),3));
  geometry.userData={plan,tetra,sphere};
  const material=new THREE.LineBasicMaterial({color:0x30343a,transparent:true,opacity:.72});
  const line=new THREE.Line(geometry,material);
  line.renderOrder=5;root.add(line);outlineLines.push(line);
}

function labelFor(v){
  if(v<2)return 'Planificação';
  if(v<48)return 'Planificação → tetraedro';
  if(v<52)return 'Tetraedro';
  if(v<98)return 'Tetraedro → esfera';
  return 'Esfera';
}

function updateMorph(raw){
  const v=Number(raw),s=v/100;
  percent.textContent=`${Math.round(v)}%`;
  stage.textContent=labelFor(v);
  for(const mesh of faceMeshes){
    const d=mesh.geometry.userData,pos=mesh.geometry.attributes.position;
    if(s<=.5)mixPositions(pos,d.plan,d.tetra,smooth(s*2));
    else mixPositions(pos,d.tetra,d.sphere,smooth((s-.5)*2));
    mesh.geometry.computeVertexNormals();
    mesh.geometry.attributes.normal.needsUpdate=true;
  }
  for(const line of outlineLines){
    const d=line.geometry.userData,pos=line.geometry.attributes.position;
    if(s<=.5)mixPositions(pos,d.plan,d.tetra,smooth(s*2));
    else mixPositions(pos,d.tetra,d.sphere,smooth((s-.5)*2));
  }
}

function setViewFor(value){
  const v=Number(value);
  const p=v<20?new THREE.Vector3(0,0,3.5):new THREE.Vector3(1.45,1.35,1.10).normalize().multiplyScalar(3.15);
  camera.position.copy(p);camera.up.set(0,0,1);controls.target.set(0,0,0);controls.update();
}

morph.addEventListener('input',()=>{playing=false;playButton.textContent='▶ Animar';updateMorph(morph.value);});
document.querySelectorAll('[data-stop]').forEach(button=>button.addEventListener('click',()=>{
  playing=false;playButton.textContent='▶ Animar';morph.value=button.dataset.stop;updateMorph(morph.value);setViewFor(morph.value);
}));
seamsButton.addEventListener('click',()=>{
  showSeams=!showSeams;outlineLines.forEach(line=>line.visible=showSeams);
  seamsButton.textContent=`Costuras: ${showSeams?'sim':'não'}`;seamsButton.setAttribute('aria-pressed',String(showSeams));
});
resetButton.addEventListener('click',()=>setViewFor(morph.value));
playButton.addEventListener('click',()=>{
  playing=!playing;
  if(playing){playFrom=Number(morph.value);if(playFrom>=100)playFrom=0;playStart=performance.now();playButton.textContent='⏸ Pausar';}
  else playButton.textContent='▶ Animar';
});

function resize(){const r=host.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);
resize();setViewFor(0);updateMorph(0);

function animate(now){
  requestAnimationFrame(animate);
  if(playing){
    const duration=9000,elapsed=now-playStart;
    let v=playFrom+(100-playFrom)*(elapsed/duration);
    if(v>=100){v=100;playing=false;playButton.textContent='▶ Animar';}
    morph.value=String(v);updateMorph(v);
  }
  controls.update();renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
